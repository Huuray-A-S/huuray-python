name: Release

# Publishes to PyPI when a version tag is pushed:
#
#   git tag v0.1.0 && git push --follow-tags
#
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored anywhere. Configure
# the publisher once at https://pypi.org/manage/account/publishing/ for the
# "huuray" project, this repository, and the "pypi" environment below.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Gates must pass before anything is published
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch only makes sense on a tag ref. Fail fast with a clear
      # message instead of burning a full install/test cycle and then failing
      # the tag check against a branch name.
      - name: Require a tag ref
        if: github.ref_type != 'tag'
        run: |
          echo "This workflow publishes from v* tags only."
          echo "Dispatched on '${GITHUB_REF_NAME}' (${{ github.ref_type }}) — pick the tag in the 'Run workflow' ref dropdown."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # Never publish something that does not pass its own gates.
      - name: Test
        run: pytest

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy

      - name: Check the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/huuray/_version.py').read_text()).group(1))")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match src/huuray/_version.py version $PKG."
            exit 1
          fi
          echo "Publishing version $PKG."

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/huuray
    permissions:
      contents: read
      id-token: write # required for trusted publishing

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Build the sdist and wheel
        run: python -m pip install --upgrade pip build && python -m build

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
