name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    # Code scanning requires GitHub Advanced Security, which is included for
    # public repositories and licensed separately for private ones. While this
    # repository is private the analysis itself succeeds and only the upload
    # fails, which would leave a permanent red X that means nothing. Skip
    # instead; this starts running by itself the moment the repo goes public.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
