name: Spec drift

# Re-downloads the live v4 specification. When it differs from the vendored copy,
# the job opens an issue (or comments on the one already open) with the diff and
# the result of running the suite against the new spec.
#
# This is the early-warning system for API changes: a diff here is the first sign
# that a field, an endpoint, or a schema moved. The job does not change the
# repository: syncing the spec and adapting the client is done by hand.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Download the live spec
        run: python scripts/fetch_spec.py

      - name: Detect a change
        id: diff
        run: |
          if git diff --quiet -- openapi/huuray-v4.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Spec unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- openapi/huuray-v4.json
          fi

      - name: Run the gates against the new spec
        if: steps.diff.outputs.changed == 'true'
        id: verify
        continue-on-error: true
        run: pytest

      - name: Open or update an issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUITE: ${{ steps.verify.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: The Huuray v4 specification changed
        run: |
          # The marker names the spec that was downloaded, so a later run that sees
          # the same change again does not repeat itself on the issue.
          marker="spec-sha256: $(sha256sum openapi/huuray-v4.json | cut -d' ' -f1)"
          body="$RUNNER_TEMP/spec-drift.md"
          {
            echo 'The live v4 specification differs from the vendored copy in `openapi/huuray-v4.json`.'
            echo
            echo "**Suite against the new spec: ${SUITE}** ([workflow run](${RUN_URL}))"
            echo
            echo '- `success`: the change is backwards compatible with the current client. Still read the diff: a new endpoint fails the coverage gate, and a new field may be worth exposing.'
            echo '- `failure`: the change breaks something. The conformance gates are doing their job: work out what moved.'
            echo
            echo 'Checklist:'
            echo
            echo '- [ ] Read the specification diff'
            echo '- [ ] New endpoints have SDK methods, or the coverage gate is failing for a reason we accept'
            echo '- [ ] Removed or renamed fields are handled, and the change is noted in `CHANGELOG.md`'
            echo '- [ ] `info.version` is still `v4`: this client targets v4 only'
            echo '- [ ] The new spec is vendored and this issue is closed'
            echo
            echo '<details><summary>Specification diff</summary>'
            echo
            echo '```diff'
            git diff --no-color -- openapi/huuray-v4.json | head -c 50000
            echo
            echo '```'
            echo
            echo '</details>'
            echo
            echo "<!-- ${marker} -->"
          } > "$body"

          existing="$(gh issue list --state open --limit 100 --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')"

          if [ -z "$existing" ]; then
            gh label create spec-drift --color D93F0B --description 'The live v4 specification changed' 2>/dev/null || true
            gh issue create --title "$TITLE" --label spec-drift --body-file "$body" || gh issue create --title "$TITLE" --body-file "$body"
          elif gh issue view "$existing" --json body,comments --jq '[.body, .comments[].body] | join(" ")' | grep -qF "$marker"; then
            echo "Issue #${existing} already describes this change."
          else
            gh issue comment "$existing" --body-file "$body"
          fi
